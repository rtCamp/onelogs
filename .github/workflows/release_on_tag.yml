name: Publish Plugin to Github Releases
on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@a2636af0004d1c0499ffca16ac0b4cc94df70565 # v3.1.0
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm ci
        env:
          CI: true

      - name: Build Library
        shell: bash
        run: npm run build:prod

      - name: Create WordPress Plugin Zip
        run: |
          npm run plugin-zip

      - name: Upload Release Artifact with gh CLI
        if: startsWith(github.ref, 'refs/tags/dry') == false && github.ref != 'refs/heads/develop'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" || \
            gh release create "${{ github.ref_name }}" \
              --title "OneLogs ${{ github.ref_name }}" \
              --generate-notes \
              --draft
          # Upload the artifact
          gh release upload "${{ github.ref_name }}" "./onelogs.zip" --clobber
